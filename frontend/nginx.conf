server {
  listen 80;
  server_name _;

  # Arquivos gerados pelo Vite (copiados para /usr/share/nginx/html)
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback – se a rota não existe como arquivo, volta para index.html
  location / {
    try_files $uri /index.html;
  }

  # Proxy /api -> backend:8080 (nome do serviço Docker no compose)
  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://backend:8080/;
  }
}
