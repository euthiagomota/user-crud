services:
  reverse-proxy:
    image: nginx:stable
    container_name: reverse-proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
    volumes:
      - ../reverse-proxy/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../reverse-proxy/certs:/etc/nginx/certs:ro
    networks:
      - app_net

  db:
    image: postgres:16
    container_name: db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: backend

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass

      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_HOST: db
      DB_PORT: 5432

      LOG_DIR: /logs
      BACKUP_DIR: /backups

    depends_on:
      - db

    volumes:
      - ../volumes/app_logs:/logs
      - ../volumes/app_backups:/backups

    networks:
      - app_net

  frontend:
    build:
      context: ../frontend

    container_name: frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data: